# WRR router fusing the two swarm services (newapi-master + newapi-slave) behind
# one router; the router lives here because two swarm services declaring the same
# router label would collide, and WRR is file-provider-only in Traefik v3.
http:
  routers:
    # Distinct name + priority 100 so it wins Host(api.unorouter.com) without
    # colliding with any leftover docker-provider newapi router during cutover.
    newapi-ha:
      rule: "Host(`api.unorouter.com`)"
      priority: 100
      entryPoints:
        - websecure
      service: newapi-wrr
      # Zero-downtime on rolling updates: Traefik reacts to the swarm `die` event
      # late (traefik#11252), so a request can hit a just-dead task IP. dialTimeout
      # (below) fails that dial fast and this retry redispatches to the healthy sibling.
      middlewares:
        - newapi-retry
      tls:
        certResolver: letsencrypt

  middlewares:
    newapi-retry:
      retry:
        attempts: 4
        initialInterval: 100ms

  serversTransports:
    # Cap the backend dial so a stale dead-task IP fails fast (~2s) instead of
    # hanging to timeout, letting the retry middleware redispatch.
    newapi-fast:
      forwardingTimeouts:
        dialTimeout: "2s"

  services:
    newapi-wrr:
      weighted:
        services:
          - name: "newapi-master@swarm"
            weight: 1
          - name: "newapi-slave@swarm"
            weight: 1
        # Propagate child health up the WRR so a fully-down child is dropped from
        # rotation; child probe intervals are set via their deploy.labels.
        healthCheck: {}
