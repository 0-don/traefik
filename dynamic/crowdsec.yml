http:
  middlewares:
    crowdsec:
      plugin:
        crowdsec-bouncer:
          enabled: true
          crowdsecMode: stream
          crowdsecLapiScheme: http
          crowdsecLapiHost: crowdsec:8080
          crowdsecLapiKey: "052ee0b1e0cf335d096ef25f5586491ec7bf217cddd7dc6e26ec215813e74f53"
          updateIntervalSeconds: 15
          # Real client IPs that skip the CrowdSec check entirely (never queried
          # against LAPI, so CAPI community blocklists can't 403 them either).
          # Parser/postoverflow whitelists only stop LOCAL scenarios; CAPI bans
          # are enforced at the bouncer, so trusted clients must be listed HERE.
          clientTrustedIPs:
            - 136.243.0.0/16   # firm NAT pool (Hetzner) - rotating egress IPs
            - 88.130.0.0/16    # dev/sync box IPv4 (1&1 Versatel rotation)
            - 2001:9e8::/32    # dev/sync box IPv6 (1&1 Versatel /32 alloc)
          forwardedHeadersTrustedIPs:
            - 172.16.0.0/12
            - 10.0.0.0/8
            - 192.168.0.0/16
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
