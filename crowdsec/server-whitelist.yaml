name: server-ip-whitelist
description: Whitelist server and admin IPs to prevent banning from internal traffic
whitelist:
  reason: Server and admin traffic
  ip:
    - ${SERVER_IP}
    - 185.209.196.213
  cidr:
    - 88.130.0.0/16 # dev/sync box IPv4 (1&1 Versatel rotates within this range)
    - 2001:9e8::/32 # dev/sync box IPv6 (1&1 Versatel /32 alloc; ISP rotates the whole /64 so pin the ISP block)
