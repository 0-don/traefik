services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    cpus: 2.0
    mem_limit: 1g
    memswap_limit: 1g
    command:
      - --providers.docker=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --api.dashboard=true
      # LetsEncrypt
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.email=$TRAEFIK_ACME_EMAIL
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # 0 = no wall-clock cap on streamed responses (SSE/long LLM reasoning).
      # Stuck/silent streams are reaped upstream by new-api STREAMING_TIMEOUT (idle).
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=60s
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=letsencrypt
      - --entrypoints.websecure.http.tls.domains[0].main=$TRAEFIK_BASE_DNS
      - --entrypoints.websecure.http.tls.domains[0].sans=*.$TRAEFIK_BASE_DNS
      # Trust Cloudflare ranges + the proxy docker subnet (172.18/16) so Traefik
      # reads the real client IP forwarded by the internal cloudflared tunnel.
      # Without it every request logs cloudflared's IP (172.18.0.x).
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=172.18.0.0/16,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      # Backend response timeout (5 min for LLM non-streaming requests)
      - --serversTransport.forwardingTimeouts.responseHeaderTimeout=300s
      - --serversTransport.forwardingTimeouts.dialTimeout=5s
      - --serversTransport.forwardingTimeouts.idleConnTimeout=30s
    environment:
      - CLOUDFLARE_EMAIL=$CLOUDFLARE_EMAIL
      - CLOUDFLARE_DNS_API_TOKEN=$CLOUDFLARE_DNS_API_TOKEN
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/traefik:/letsencrypt
      - traefik-logs:/var/log/traefik
      - ./dynamic:/etc/traefik/dynamic:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`$TRAEFIK_DASHBOARD_HOST`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=traefik-auth
      - traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$2y$$05$$QgoabVnNBN3gR4wezwQovOm0glw00bQvUPORrYxz7.rI/rnw07cBG

  # Komodo replaces the per-repo self-hosted runners (29 of them cost 3.0GB RAM
  # and 71G disk on the old box). Core holds the env vars and redeploys stacks
  # from git; Periphery is the agent that drives this host's docker.
  # Secrets live in Core, not in the repo and not baked into images.
  komodo-db:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.6.0
    container_name: komodo-db
    restart: always
    labels:
      - traefik.enable=false
      - komodo.skip= # never stopped by StopAllContainers
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - komodo-postgres:/var/lib/postgresql/data
    networks:
      - proxy

  komodo-ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.6.0
    container_name: komodo-ferretdb
    restart: always
    depends_on:
      - komodo-db
    labels:
      - traefik.enable=false
      - komodo.skip=
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@komodo-db:5432/postgres
    volumes:
      - komodo-ferretdb:/state
    networks:
      - proxy

  komodo:
    image: ghcr.io/moghtech/komodo-core:2
    container_name: komodo
    init: true
    restart: always
    depends_on:
      - komodo-ferretdb
    env_file:
      - .env
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_HOST: https://${KOMODO_HOST}
      KOMODO_PASSKEY: ${KOMODO_PASSKEY}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
    volumes:
      - komodo-keys:/config/keys
      - /etc/komodo/backups:/backups
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.komodo.rule=Host(`${KOMODO_HOST}`)
      - traefik.http.routers.komodo.entrypoints=websecure
      - traefik.http.routers.komodo.tls.certresolver=letsencrypt
      - traefik.http.services.komodo.loadbalancer.server.port=9120

  # No ports published: Core reaches it over the compose network, so the agent
  # is not exposed to the internet (the default periphery setup is open).
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    container_name: komodo-periphery
    init: true
    restart: always
    depends_on:
      - komodo
    env_file:
      - .env
    environment:
      PERIPHERY_PASSKEYS: ${KOMODO_PASSKEY}
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
    labels:
      - traefik.enable=false
      - komodo.skip=
    volumes:
      - komodo-keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Path must match inside and outside the container or docker resolves the
      # stack directories against the wrong root (komodo#180).
      - /etc/komodo:/etc/komodo
    networks:
      - proxy

  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: always
    labels:
      - traefik.enable=false
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # One-shot container that tunes kernel params for DDoS resilience.
  # Runs at every `docker compose up`, exits immediately after applying.
  sysctl-init:
    image: alpine:latest
    container_name: sysctl-init
    privileged: true
    pid: host
    network_mode: host
    restart: "no"
    labels:
      - traefik.enable=false
    command:
      - sh
      - -c
      - |
        sysctl -w net.netfilter.nf_conntrack_max=2097152
        sysctl -w net.netfilter.nf_conntrack_buckets=262144
        sysctl -w net.netfilter.nf_conntrack_tcp_timeout_time_wait=30
        sysctl -w net.netfilter.nf_conntrack_tcp_timeout_established=300
        sysctl -w net.netfilter.nf_conntrack_tcp_timeout_close_wait=10

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN
    networks:
      - proxy
    labels:
      - traefik.enable=false

volumes:
  traefik-logs:
  komodo-postgres:
  komodo-ferretdb:
  komodo-keys:

networks:
  proxy:
    external: false
    name: proxy
